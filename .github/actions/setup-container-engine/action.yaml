name: Setup Container Engine
description: Install Docker or Podman engine and enable an appropriate Docker CLI context.
inputs:
  version:
    required: true
    default: docker@latest
    description: |
      Engine version of format [<type>@]<version>, where:
        - type: either "docker" or "podman" (default: docker)
        - version: either "latest" or "[v]major[.minor[.patch]]" version of the engine.

      Default: docker@latest
runs:
  using: composite
  steps:
    - name: Parse version
      uses: mathiasvr/command-output@v2.0.0
      id: parse-version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      with:
        shell: python
        # Note: in VS Code, consider installing `harrydowning.yaml-embedded-languages` to enable code highlighting
        # in the embedded python code.
        run: | # python
          import os
          import re
          import sys

          version_string = os.getenv("INPUT_VERSION")
          if version_string is None and len(sys.argv) > 1:
            version_string = sys.argv[1]
          if not version_string:
            print("No engine version given", file=sys.stderr)
            sys.exit(1)

          parts = version_string.lower().split("@", 1)

          if len(parts) == 1:
            engine = "docker"
            version = parts[0]
          else:
            engine = parts[0]
            version = parts[1]

          if engine not in {"docker", "podman"}:
            print(f"Unrecognized engine type '{engine}'", file=sys.stderr)
            sys.exit(1)

          # These values reach GITHUB_ENV and are interpolated into shell commands and
          # a download URL, and this action is reachable from a workflow_dispatch
          # input. Anything but a plain version -- metacharacters, newlines, path
          # traversal -- is rejected here rather than at each of those sinks.
          # [0-9] rather than \d, which also accepts non-ASCII digits that would then
          # reach the URL.
          if not re.fullmatch(r"latest|v?[0-9]+(\.[0-9]+)*", version):
            print(f"Unrecognized engine version '{version}'", file=sys.stderr)
            sys.exit(1)

          print(f"ENGINE_TYPE={engine}")
          print(f"ENGINE_VERSION={version}")

    - name: Export parsed version
      shell: bash
      # Via the environment, not `${{ }}` interpolation: the latter would execute a
      # crafted version rather than write it.
      env:
        PARSED_VERSION: ${{ steps.parse-version.outputs.stdout }}
      run: | # shell
        set -euo pipefail

        # Only the two expected assignments are forwarded, so nothing else in the
        # captured stdout can define an environment variable for later steps.
        mapfile -t parsed <<< "${PARSED_VERSION}"
        if (( ${#parsed[@]} < 2 )) \
          || [[ "${parsed[0]}" != ENGINE_TYPE=* || "${parsed[1]}" != ENGINE_VERSION=* ]]; then
          echo "::error::unexpected output from the version parser"
          printf '%s\n' "${PARSED_VERSION}"
          exit 1
        fi
        printf '%s\n%s\n' "${parsed[0]}" "${parsed[1]}" >> "$GITHUB_ENV"

    - name: Setup Docker
      if: env.ENGINE_TYPE == 'docker'
      uses: ./.github/actions/setup-docker
      with:
        version: ${{ env.ENGINE_VERSION }}

    - name: Setup Podman
      if: env.ENGINE_TYPE == 'podman'
      uses: ./.github/actions/setup-podman
      with:
        version: ${{ env.ENGINE_VERSION }}
