name: Setup Podman
description: Install Podman
inputs:
  version:
    required: true
    default: latest
    description: Engine version
runs:
  using: composite
  steps:
    - name: Set up Docker APT repository
      shell: bash
      run: | # shell
        set -euo pipefail

        # See https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update

    - name: Install Docker CLI
      shell: bash
      run: sudo apt-get install -y docker-ce-cli

    - name: Install Podman Engine
      shell: bash
      run: | # shell
        set -euo pipefail

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${{ inputs.version }}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${{ inputs.version }}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "Error: Downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        tar -xzf "${ARCHIVE_FILE}"
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman searches /usr/bin/crun before the bundled /usr/local/bin/crun, so
        # install the bundled binary there too. Otherwise podman silently runs
        # whatever crun the runner image ships while `crun --version` reports the
        # bundled one -- the wrong runtime, reported wrongly.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun
        echo "crun version (/usr/bin/crun): $(/usr/bin/crun --version | head -1)"

        sudo podman version

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        podman_version=$(sudo podman version --format="{{.Server.Version}}")
        podman_socket="/var/run/podman-${podman_version}.sock"
        service_log="/tmp/podman-system-service.log"

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        service_pid=$!

        # Report why the engine never came up, then fail.
        fail() {
          echo "$1"
          echo "--- podman system service log ---"; cat "${service_log}" || true
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        }

        # podman-static is built without systemd support, so there is no readiness
        # notification to block on and the socket has to be waited for. The deadline
        # is the failure bound surfaced to a human, not a synchronisation device: it
        # only decides how long we let an engine that may never start hold the job.
        #
        # The previous helper set `exit_code` once *outside* its loop, so `||`
        # short-circuiting on success never reset it. It could therefore only ever
        # succeed if the very first attempt did -- which is what broke CI when podman
        # 6.1.1 began binding its socket a few milliseconds later than 5.8.4.
        deadline=$(( SECONDS + 60 ))
        until [[ -S "${podman_socket}" ]]; do
          kill -0 "${service_pid}" 2>/dev/null \
            || fail "podman system service exited before creating ${podman_socket}."
          (( SECONDS < deadline )) \
            || fail "podman system service did not create ${podman_socket} within 60s."
          sleep 0.1
        done

        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        docker context create --docker "host=unix://${podman_socket}" "podman-${podman_version}"
        docker context use "podman-${podman_version}"

        # The socket exists from bind(2), which precedes listen(2), so a connection
        # can still be refused for a moment after it appears. It can also outlive a
        # service killed without cleanup, so liveness is rechecked here too.
        deadline=$(( SECONDS + 60 ))
        until docker version --format 'Server: {{.Server.Version}}'; do
          kill -0 "${service_pid}" 2>/dev/null \
            || fail "podman system service died before serving the API."
          (( SECONDS < deadline )) \
            || fail "podman API on ${podman_socket} never became reachable."
          sleep 0.1
        done

        # Surface startup warnings, which used to reach the log via the step's stdout.
        echo "--- podman system service log ---"; cat "${service_log}" || true
