name: Setup Podman
description: Install Podman and point the Docker CLI at it
inputs:
  version:
    required: true
    default: latest
    description: |
      Either "latest" or a full "[v]major.minor.patch" version. podman-static only
      tags full versions, so partial ones are rejected rather than 404ing.
runs:
  using: composite
  steps:
    - name: Install Podman Engine
      shell: bash
      # Passed through the environment rather than interpolated into the script: this
      # action is reachable from a workflow_dispatch input, so a crafted version would
      # otherwise run as a command.
      env:
        VERSION: ${{ inputs.version }}
      run: | # shell
        set -euo pipefail

        # podman-static publishes Linux tarballs only, so there is nothing to install
        # elsewhere. Say so here rather than failing obscurely inside tar or podman.
        if [[ "$(uname -s)" != Linux ]]; then
          echo "::error::setup-podman supports Linux runners only (got $(uname -s))"
          exit 1
        fi

        # This action no longer installs a docker CLI -- the Linux runner images ship
        # one -- so the dependency is asserted rather than assumed. Without this, a
        # runner lacking it starts a root podman service and then dies on a bare
        # "docker: command not found", leaking the engine and the socket.
        command -v docker >/dev/null \
          || { echo "::error::setup-podman needs a preinstalled docker CLI"; exit 1; }

        # Ubuntu noble ships crun 1.14.1, below the 1.14.3 that podman's OCI specs
        # need, so installing the bundled runtime below is load-bearing.
        CRUN_MIN_VERSION="1.14.3"

        # Gates the download URL: curl resolves `..`, so an unvalidated version could
        # point this at an arbitrary repository whose usr/ and etc/ are then rsynced
        # over / as root. Only `latest` or a full version is admitted, which is also
        # all podman-static tags.
        if [[ "${VERSION}" != "latest" && ! "${VERSION}" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::podman needs a full major.minor.patch version or 'latest', got '${VERSION}'"
          exit 1
        fi

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${VERSION}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${VERSION#v}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "::error::downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        # Cleared first: tar does not remove files a previous extraction left behind,
        # and everything under here is rsynced over / as root. Runner-owned, since the
        # unprivileged tar below creates it.
        rm -rf "/tmp/${ARCHIVE_NAME}"
        tar -xzf "${ARCHIVE_FILE}"
        for required in usr/local/bin/podman usr/local/bin/crun; do
          if [[ ! -x "${ARCHIVE_NAME}/${required}" ]]; then
            echo "::error::the podman-static tarball has no ${required}"
            exit 1
          fi
        done
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman resolves its OCI runtime from absolute path lists in
        # [engine.runtimes], not from PATH, and for crun that list tries
        # /usr/bin/crun before the bundled /usr/local/bin/crun. Installing the bundled
        # binary there is what stops podman running the runner image's older crun.
        # runc needs no equivalent: podman discovers crun first.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun

        # Asserted *before* anything below trusts `sudo podman`. The runner ships its
        # own podman in /usr/bin, and installing the bundled crun over /usr/bin/crun
        # means it would report crun at the expected version too, so the runtime gates
        # alone cannot tell the two apart. For a pinned input the version check below
        # would still catch it; for `latest` -- this action's default -- nothing would.
        # `cmp` rather than a version comparison, because `latest` has no expected
        # version and a path alone does not establish identity.
        resolved_podman=$(sudo sh -c 'command -v podman') \
          || { echo "::error::sudo cannot resolve podman at all"; exit 1; }
        # cmp exits 1 for "differs" but 2 for an I/O error, which would otherwise be
        # reported as a mismatch and send the reader hunting the wrong problem.
        sudo cmp -s "${resolved_podman}" "${ARCHIVE_NAME}/usr/local/bin/podman" || case $? in
          1) echo "::error::sudo resolves podman to ${resolved_podman}, which is not the binary just installed"
             exit 1 ;;
          *) echo "::error::could not compare ${resolved_podman} with the extracted podman binary"
             exit 1 ;;
        esac

        sudo podman version

        podman_version=$(sudo podman version --format="{{.Server.Version}}") \
          || { echo "::error::could not determine the podman server version"; exit 1; }
        if [[ "${VERSION}" != "latest" && "${podman_version}" != "${VERSION#v}" ]]; then
          echo "::error::requested podman ${VERSION#v} but ${podman_version} is what runs"
          exit 1
        fi

        # Defence in depth on the runtime. The tarball's containers.conf does not pin
        # runtime="crun", so podman discovers it at run time; these gates are what turn
        # a mis-discovery into a failure rather than a silently wrong engine. Name
        # first so the floor applies to the runtime it describes; Version is a
        # multi-line banner, so it goes last.
        runtime_info=$(sudo podman info --format '{{.Host.OCIRuntime.Name}}|{{.Host.OCIRuntime.Path}}|{{.Host.OCIRuntime.Version}}') \
          || { echo "::error::podman info failed; the engine cannot describe its runtime"; exit 1; }
        runtime_name="${runtime_info%%|*}"
        runtime_rest="${runtime_info#*|}"
        runtime_path="${runtime_rest%%|*}"
        runtime_version="${runtime_rest#*|}"
        echo "podman resolved OCI runtime: ${runtime_name} at ${runtime_path}"
        echo "${runtime_version}"

        # Matched on the literal "crun version " prefix, which is what excludes the
        # banner's OCI `spec:` version.
        crun_version_re='crun version ([0-9]+\.[0-9]+(\.[0-9]+)?)'
        if [[ "${runtime_name}" != crun ]]; then
          echo "::error::podman resolved ${runtime_name} at ${runtime_path}, not the bundled crun"
          exit 1
        fi
        if [[ ! "${runtime_version}" =~ $crun_version_re ]]; then
          echo "::error::could not read a crun version from podman info"
          exit 1
        fi
        if ! printf '%s\n%s\n' "${CRUN_MIN_VERSION}" "${BASH_REMATCH[1]}" | sort -V -C; then
          echo "::error::crun ${BASH_REMATCH[1]} is older than the required ${CRUN_MIN_VERSION}"
          exit 1
        fi

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        # Separate budgets: a slow socket must not eat the API's grace period, which
        # would report an API failure that never happened.
        socket_timeout=60
        api_timeout=60

        # Unique names, so a second invocation in the same job cannot overwrite the
        # first one's diagnostics. Created before fail() because it reads them.
        service_log=$(mktemp "${RUNNER_TEMP:-/tmp}/podman-service.XXXXXX") \
          || { echo "::error::could not create a log file under ${RUNNER_TEMP:-/tmp}"; exit 1; }
        probe_log=$(mktemp "${RUNNER_TEMP:-/tmp}/docker-probe.XXXXXX") \
          || { echo "::error::could not create a log file under ${RUNNER_TEMP:-/tmp}"; exit 1; }

        # Defined before anything that can fail, so every failure below reports with
        # the service log and process state rather than dying on bare errexit.
        fail() {
          echo "::error::$1"
          echo "--- podman system service log ---"; cat "${service_log}" || true
          if [[ -s "${probe_log}" ]]; then
            echo "--- last docker probe output ---"; cat "${probe_log}"
          fi
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        }

        podman_version=$(sudo podman version --format="{{.Server.Version}}") \
          || fail "could not determine the podman server version"
        podman_socket="/var/run/podman-${podman_version}.sock"
        context_name="podman-${podman_version}"

        # A previous invocation in this job would still be serving this same
        # version-derived path, and removing the socket under it would leak an engine
        # that never exits (--time=0). Stop it first, then clear the socket so `-S`
        # below can only become true from the new engine's own bind(2): a leftover
        # file would otherwise satisfy the wait immediately, the chown would land on
        # that inode, and podman -- which unlinks a stale socket before binding --
        # would serve a fresh root-owned one the runner user cannot reach.
        # The [p] bracket stops the pattern matching the argv of the `sudo pkill` that
        # carries it -- otherwise sudo SIGTERMs itself, can be killed mid-enumeration,
        # and always reports success. Dots are escaped so the version cannot glob.
        stale_service_re="podman system service .*/var/run/[p]odman-${podman_version//./\\.}\.sock"
        sudo pkill -f "${stale_service_re}" || true
        sudo rm -f "${podman_socket}"

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        # sudo waits for the engine and exits with its status, so this pid standing
        # means precisely "the engine has not exited". It also exists from the moment
        # the job is backgrounded, whereas podman itself only appears once sudo has
        # forked and exec'd it -- testing for podman alone fails inside that window.
        service_pid=$!

        # podman-static is built without systemd support, so `systemctl` cannot be
        # used to await readiness here. The deadline is the failure bound reported to
        # a human, not a synchronisation device.
        deadline=$(( SECONDS + socket_timeout ))
        until [[ -S "${podman_socket}" ]]; do
          kill -0 "${service_pid}" 2>/dev/null || [[ -S "${podman_socket}" ]] \
            || fail "podman system service exited before creating ${podman_socket}."
          (( SECONDS < deadline )) \
            || fail "podman system service did not create ${podman_socket} within ${socket_timeout}s."
          sleep 0.1
        done

        # podman creates the socket root-owned and not writable by the runner user,
        # and connecting to a unix socket needs write, so this is what makes it usable.
        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        # Required, not merely defensive: `docker context rm` refuses to remove the
        # context that is currently in use.
        docker context use default >/dev/null
        if docker context inspect "${context_name}" >/dev/null 2>&1; then
          docker context rm -f "${context_name}" >/dev/null
        fi
        docker context create --docker "host=unix://${podman_socket}" "${context_name}"
        docker context use "${context_name}"

        # The socket exists from bind(2), which precedes listen(2), so a connection is
        # refused -- exit 1, immediately -- until the API is actually serving. Every
        # status is retried until the deadline: `docker ps` exits 1 when it cannot
        # reach the daemon, which is the transient case, and `timeout` passes the
        # child's status through verbatim so its own 125/126/127 cannot be told apart
        # from the probe's. A probe that can never succeed is caught by the liveness
        # check and the deadline instead. -k also sends SIGKILL, so a probe ignoring
        # SIGTERM cannot outlive its bound and hang the job.
        deadline=$(( SECONDS + api_timeout ))
        until timeout -k 1 5 docker ps >"${probe_log}" 2>&1; do
          kill -0 "${service_pid}" 2>/dev/null \
            || fail "podman system service died before serving the API"
          (( SECONDS < deadline )) \
            || fail "podman API on ${podman_socket} was unreachable for ${api_timeout}s"
          sleep 0.5
        done

        # The CLI resolves DOCKER_HOST ahead of the selected context, so without this
        # a job with DOCKER_HOST set would silently talk to the runner's own dockerd
        # and pass while never touching podman. Routed through fail() so a non-zero
        # `docker version` prints diagnostics rather than dying at the assignment.
        server_version=$(docker version --format '{{.Server.Version}}') \
          || fail "docker version failed against ${podman_socket}"
        if [[ "${server_version}" != "${podman_version}" ]]; then
          fail "docker CLI is served by ${server_version}, not the podman ${podman_version} started here"
        fi

        echo "--- podman system service startup log ---"; cat "${service_log}" || true
        echo "docker CLI is served by podman ${server_version}"
