name: Setup Podman
description: Install Podman
inputs:
  version:
    required: true
    default: latest
    description: Engine version
runs:
  using: composite
  steps:
    - name: Set up Docker APT repository
      shell: bash
      run: | # shell
        set -euo pipefail

        # See https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update

    - name: Install Docker CLI
      shell: bash
      # --no-install-recommends skips docker-buildx-plugin and docker-compose-plugin,
      # which conflict with the runner's own moby-buildx. The runner's CLI is
      # replaced either way, because moby-cli declares Conflicts/Replaces on
      # docker-ce-cli.
      run: sudo apt-get install -y --no-install-recommends docker-ce-cli

    - name: Install Podman Engine
      shell: bash
      # Passed through the environment rather than interpolated into the script: this
      # action is reachable from a workflow_dispatch input, so a crafted version would
      # otherwise run as a command.
      env:
        VERSION: ${{ inputs.version }}
      run: | # shell
        set -euo pipefail

        # Validated before it reaches the URL: curl resolves `..`, so an unchecked
        # version could point the download at an arbitrary repository whose usr/ and
        # etc/ are then rsynced over / as root below.
        if [[ ! "${VERSION}" =~ ^(latest|v?[0-9]+(\.[0-9]+)*)$ ]]; then
          echo "::error::unsupported podman version '${VERSION}'"
          exit 1
        fi

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${VERSION}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${VERSION#v}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "Error: Downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        # Cleared first: tar does not remove files a previous extraction left behind,
        # and everything under here is rsynced over / as root.
        sudo rm -rf "/tmp/${ARCHIVE_NAME}"
        tar -xzf "${ARCHIVE_FILE}"
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman searches /usr/bin/crun ahead of the bundled /usr/local/bin/crun, so
        # install the bundled binary there too -- otherwise podman silently runs
        # whichever crun the runner image ships. Only crun needs this: the tarball's
        # runc already lands in /usr/local/bin via the rsync above, which precedes
        # /usr/bin on the default unit PATH, so touching /usr/bin/runc changes
        # nothing.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun

        sudo podman version

        # Ask podman which runtime it resolved rather than running one ourselves and
        # assuming it picked the same binary. Name first so the floor below is only
        # applied to the runtime it actually describes; Version is a multi-line
        # banner, so it goes last.
        CRUN_MIN_VERSION="1.14.3"
        runtime_info=$(sudo podman info --format '{{.Host.OCIRuntime.Name}}|{{.Host.OCIRuntime.Path}}|{{.Host.OCIRuntime.Version}}')
        runtime_name="${runtime_info%%|*}"
        runtime_rest="${runtime_info#*|}"
        runtime_path="${runtime_rest%%|*}"
        runtime_version="${runtime_rest#*|}"
        echo "podman resolved OCI runtime: ${runtime_name} at ${runtime_path}"
        echo "${runtime_version}"

        # Reported, not enforced: installing the bundled runtime already makes a
        # modern crun structural, so a parse of a human-readable banner should not be
        # able to fail the job. Anchored to the version line, because the banner also
        # carries an OCI `spec:` version that an unanchored match would pick up.
        crun_version_re='crun version ([0-9]+\.[0-9]+(\.[0-9]+)?)'
        if [[ "${runtime_name}" != crun ]]; then
          echo "::warning::podman resolved ${runtime_name}, not the bundled crun"
        elif [[ ! "${runtime_version}" =~ $crun_version_re ]]; then
          echo "::warning::could not read a crun version from podman info"
        elif ! printf '%s\n%s\n' "${CRUN_MIN_VERSION}" "${BASH_REMATCH[1]}" | sort -V -C; then
          echo "::warning::crun ${BASH_REMATCH[1]} is older than the expected ${CRUN_MIN_VERSION}"
        fi

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        # Separate budgets: a slow socket must not eat the API's grace period, which
        # would report an API failure that never happened.
        socket_timeout=60
        api_timeout=60

        podman_version=$(sudo podman version --format="{{.Server.Version}}")
        if [[ -z "${podman_version}" ]]; then
          echo "::error::could not determine the podman server version"
          exit 1
        fi
        podman_socket="/var/run/podman-${podman_version}.sock"
        context_name="podman-${podman_version}"
        # Unique names, so a second invocation in the same job cannot overwrite the
        # first one's diagnostics.
        service_log=$(mktemp "${RUNNER_TEMP:-/tmp}/podman-service.XXXXXX")
        probe_log=$(mktemp "${RUNNER_TEMP:-/tmp}/docker-probe.XXXXXX")

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        # sudo waits for the engine and exits with its status, so this pid standing
        # means precisely "the engine has not exited". It also exists from the moment
        # the job is backgrounded, whereas podman itself only appears once sudo has
        # forked and exec'd it -- testing for podman alone fails inside that window.
        service_pid=$!

        # Detail is printed as plain lines: a newline would truncate an annotation.
        fail() {
          echo "::error::$1"
          echo "--- podman system service log ---"; cat "${service_log}" || true
          echo "--- last docker probe output ---"; cat "${probe_log}" 2>/dev/null || true
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        }

        # podman-static is built without systemd support, so `systemctl` cannot be
        # used to await readiness here. The deadline is the failure bound reported to
        # a human, not a synchronisation device.
        deadline=$(( SECONDS + socket_timeout ))
        until [[ -S "${podman_socket}" ]]; do
          kill -0 "${service_pid}" 2>/dev/null || [[ -S "${podman_socket}" ]] \
            || fail "podman system service exited before creating ${podman_socket}."
          (( SECONDS < deadline )) \
            || fail "podman system service did not create ${podman_socket} within ${socket_timeout}s."
          sleep 0.1
        done

        # podman creates the socket 0600 root:root, so this is what makes it usable.
        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        # Leave the current context before removing it, so a failure between removal
        # and creation cannot strand the CLI on a context that no longer exists.
        docker context use default >/dev/null
        if docker context inspect "${context_name}" >/dev/null 2>&1; then
          docker context rm -f "${context_name}" >/dev/null
        fi
        docker context create --docker "host=unix://${podman_socket}" "${context_name}"
        docker context use "${context_name}"

        # The socket exists from bind(2), which precedes listen(2), so a connection is
        # refused -- exit 1, immediately -- until the API is actually serving. Every
        # status is retried until this loop's own deadline: `timeout` passes the
        # child's status through verbatim, so its 125/126/127 cannot be told apart
        # from docker's own (docker uses 125 for daemon errors, which are transient
        # during startup). A probe that can never succeed is caught by the liveness
        # check and the deadline instead.
        deadline=$(( SECONDS + api_timeout ))
        until timeout 5 docker ps >"${probe_log}" 2>&1; do
          kill -0 "${service_pid}" 2>/dev/null \
            || fail "podman system service died before serving the API"
          if (( SECONDS >= deadline )); then
            # Authoritative: the engine may have become ready since the last probe.
            timeout 5 docker ps >"${probe_log}" 2>&1 && break
            fail "podman API on ${podman_socket} was unreachable for ${api_timeout}s"
          fi
          sleep 0.5
        done

        # The CLI resolves DOCKER_HOST ahead of the selected context, so without this
        # assertion a job with DOCKER_HOST set would silently talk to the runner's own
        # dockerd and pass while never touching podman.
        server_version=$(docker version --format '{{.Server.Version}}')
        if [[ "${server_version}" != "${podman_version}" ]]; then
          fail "docker CLI is served by ${server_version}, not the podman ${podman_version} started here"
        fi

        echo "--- podman system service startup log ---"; cat "${service_log}" || true
        echo "docker CLI is served by podman ${server_version}"
