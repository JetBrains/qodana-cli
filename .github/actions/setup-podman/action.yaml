name: Setup Podman
description: Install Podman
inputs:
  version:
    required: true
    default: latest
    description: Engine version
runs:
  using: composite
  steps:
    - name: Set up Docker APT repository
      shell: bash
      run: | # shell
        set -euo pipefail

        # See https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
        sudo apt-get update
        sudo apt-get install ca-certificates curl inotify-tools
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update

    - name: Install Docker CLI
      shell: bash
      run: sudo apt-get install docker-ce-cli

    - name: Install Podman Engine
      shell: bash
      run: | # shell
        set -euo pipefail

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${{ inputs.version }}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${{ inputs.version }}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "Error: Downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        tar -xzf "${ARCHIVE_FILE}"
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman resolves its OCI runtime as /usr/bin/crun before the bundled
        # /usr/local/bin/crun, so install the bundled binary there too. Otherwise
        # podman silently runs whatever crun the runner image ships while
        # `crun --version` reports the bundled one.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun
        echo "crun version (/usr/bin/crun): $(/usr/bin/crun --version | head -1)"

        sudo podman version

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        podman_version=$(sudo podman version --format="{{.Server.Version}}")
        podman_socket="/var/run/podman-${podman_version}.sock"
        service_log="/tmp/podman-system-service.log"
        socket_regex="^podman-${podman_version//./\\.}\.sock$"

        # Watch for the socket before starting the service, so its creation cannot be
        # missed. inotifywait announces "Watches established." once it is armed;
        # blocking on that line is what makes this race-free without polling.
        coproc socket_watch { inotifywait -e create --include "${socket_regex}" /var/run 2>&1; }
        while IFS= read -r line <&"${socket_watch[0]}"; do
          [[ "$line" == *"Watches established."* ]] && break
        done

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        service_pid=$!

        # Whichever comes first: the socket is created, or the service dies. Racing the
        # two means a service that fails to start reports immediately instead of
        # hanging until the job timeout.
        wait -n "${socket_watch_PID}" "${service_pid}" || true

        if [[ ! -S "${podman_socket}" ]]; then
          echo "podman system service did not create ${podman_socket}."
          echo "--- service log ---"; cat "${service_log}" || true
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        fi

        # Hand the socket to the runner user. The previous groupadd/usermod/`newgrp
        # docker` dance replaced this shell, which also happened to delay the first
        # readiness check long enough to paper over the polling bug fixed here.
        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        docker context create --docker "host=unix://${podman_socket}" "podman-${podman_version}"
        docker context use "podman-${podman_version}"

        # The socket is listening, so this connects and blocks until the API serves it.
        docker version --format 'Server: {{.Server.Version}}'
