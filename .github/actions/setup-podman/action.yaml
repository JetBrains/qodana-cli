name: Setup Podman
description: Install Podman
inputs:
  version:
    required: true
    default: latest
    description: Engine version
runs:
  using: composite
  steps:
    - name: Set up Docker APT repository
      shell: bash
      run: | # shell
        set -euo pipefail

        # See https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update

    - name: Install Docker CLI
      shell: bash
      run: sudo apt-get install -y docker-ce-cli

    - name: Install Podman Engine
      shell: bash
      # Passed through the environment rather than interpolated into the script: this
      # action is reachable from a workflow_dispatch input, so a crafted version would
      # otherwise run as a command.
      env:
        VERSION: ${{ inputs.version }}
      run: | # shell
        set -euo pipefail

        # podman generates OCI specs that this runtime version or newer can read.
        CRUN_MIN_VERSION="1.14.3"

        # Validated before it reaches the URL: curl resolves `..`, so an unchecked
        # version could point the download at an arbitrary repository whose usr/ and
        # etc/ are then rsynced over / as root below.
        if [[ ! "${VERSION}" =~ ^(latest|v?[0-9]+(\.[0-9]+)*)$ ]]; then
          echo "::error::unsupported podman version '${VERSION}'"
          exit 1
        fi

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${VERSION}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${VERSION#v}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "Error: Downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        tar -xzf "${ARCHIVE_FILE}"
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman searches /usr/bin before the bundled /usr/local/bin, so install the
        # bundled runtimes there too. Otherwise podman silently runs whichever crun or
        # runc the runner image happens to ship.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/runc" /usr/bin/runc

        sudo podman version

        # Ask podman which runtime it resolved, rather than running one ourselves and
        # assuming it picked the same binary.
        runtime_path=$(sudo podman info --format '{{.Host.OCIRuntime.Path}}')
        runtime_version=$(sudo podman info --format '{{.Host.OCIRuntime.Version}}')
        echo "podman resolved OCI runtime: ${runtime_path} (${runtime_version})"

        # Reported rather than enforced. Installing the bundled runtime already makes
        # a modern crun structural, and `podman info` has been observed reporting a
        # runc banner for a crun path, so a hard check here risks aborting a healthy
        # job over a parse. Surfacing the value lets a real mismatch be seen.
        if [[ ! "${runtime_version}" =~ ([0-9]+\.[0-9]+(\.[0-9]+)?) ]]; then
          echo "::warning::could not read a version out of '${runtime_version}'"
        elif ! printf '%s\n%s\n' "${CRUN_MIN_VERSION}" "${BASH_REMATCH[1]}" | sort -V -C; then
          echo "::warning::OCI runtime reports ${BASH_REMATCH[1]}, older than the expected ${CRUN_MIN_VERSION}"
        fi

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        # Budget for the engine to start and answer, spanning both waits below rather
        # than resetting between them.
        startup_timeout=60

        podman_version=$(sudo podman version --format="{{.Server.Version}}")
        if [[ -z "${podman_version}" ]]; then
          echo "::error::could not determine the podman server version"
          exit 1
        fi
        podman_socket="/var/run/podman-${podman_version}.sock"
        service_log="/tmp/podman-system-service.log"
        probe_log="/tmp/docker-probe.log"

        # podman binds with a plain net.Listen and never unlinks a stale socket, so a
        # leftover file would make the new service exit with "address already in use"
        # while the -S test below is already satisfied.
        sudo rm -f "${podman_socket}"

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        # sudo waits for the engine and exits with its status, so this pid standing
        # means precisely "the engine has not exited". It also exists from the moment
        # the job is backgrounded, whereas podman itself only appears once sudo has
        # forked and exec'd it -- testing for podman alone fails inside that window.
        service_pid=$!

        fail() {
          echo "::error::$1"
          echo "--- podman system service log ---"; cat "${service_log}" || true
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        }

        # podman-static is built without systemd support, so there is no readiness
        # notification to block on. The deadline is the failure bound reported to a
        # human, not a synchronisation device.
        deadline=$(( SECONDS + startup_timeout ))
        until [[ -S "${podman_socket}" ]]; do
          kill -0 "${service_pid}" 2>/dev/null || [[ -S "${podman_socket}" ]] \
            || fail "podman system service exited before creating ${podman_socket}."
          (( SECONDS < deadline )) \
            || fail "podman system service did not create ${podman_socket} within ${startup_timeout}s."
          sleep 0.1
        done

        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        # Recreated rather than reused: an existing context of this name can carry
        # unrelated TLS or kubernetes metadata that `context update` would preserve.
        if docker context inspect "podman-${podman_version}" >/dev/null 2>&1; then
          docker context rm -f "podman-${podman_version}"
        fi
        docker context create --docker "host=unix://${podman_socket}" "podman-${podman_version}"
        docker context use "podman-${podman_version}"

        # The socket exists from bind(2), which precedes listen(2), so the API can
        # refuse a connection briefly after the socket appears. Each probe is bounded
        # because the docker CLI applies no timeout of its own, and its output is kept
        # so a permanent error is reported as itself rather than as a timeout.
        until timeout 5 docker ps >"${probe_log}" 2>&1; do
          probe_status=$?
          # 124 is the probe timing out, which is the transient case worth retrying.
          # Everything else -- 125 timeout's own failure, 126/127 unusable CLI, 128+n
          # death by signal -- is a broken probe that retrying cannot fix.
          if (( probe_status != 124 )); then
            fail "docker probe failed with exit ${probe_status}: $(cat "${probe_log}")"
          fi
          kill -0 "${service_pid}" 2>/dev/null \
            || fail "podman system service died before serving the API: $(cat "${probe_log}")"
          if (( SECONDS >= deadline )); then
            # Authoritative: the engine may have become ready since the last probe.
            timeout 5 docker ps >"${probe_log}" 2>&1 && break
            fail "podman API on ${podman_socket} was unreachable for ${startup_timeout}s: $(cat "${probe_log}")"
          fi
          sleep 0.5
        done

        echo "--- podman system service startup log ---"; cat "${service_log}" || true
        docker version --format 'Server: {{.Server.Version}}'
