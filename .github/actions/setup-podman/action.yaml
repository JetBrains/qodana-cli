name: Setup Podman
description: Install Podman
inputs:
  version:
    required: true
    default: latest
    description: Engine version
runs:
  using: composite
  steps:
    - name: Set up Docker APT repository
      shell: bash
      run: | # shell
        set -euo pipefail

        # See https://docs.docker.com/engine/install/ubuntu/#install-using-the-repository
        sudo apt-get update
        sudo apt-get install -y ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc

        # Add the repository to Apt sources:
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
        sudo apt-get update

    - name: Install Docker CLI
      shell: bash
      run: sudo apt-get install -y docker-ce-cli

    - name: Install Podman Engine
      shell: bash
      run: | # shell
        set -euo pipefail

        BASE_URL="https://github.com/mgoltzsche/podman-static/releases/latest/download"
        if [[ "${{ inputs.version }}" != "latest" ]]; then
          BASE_URL="https://github.com/mgoltzsche/podman-static/releases/download/v${{ inputs.version }}"
        fi

        ARCHIVE_NAME="podman-linux-$(dpkg --print-architecture)"
        ARCHIVE_FILE="/tmp/${ARCHIVE_NAME}.tar.gz"

        curl -fSL --retry 3 --retry-delay 5 "${BASE_URL}/${ARCHIVE_NAME}.tar.gz" -o "${ARCHIVE_FILE}"

        if ! gzip -t "${ARCHIVE_FILE}" 2>/dev/null; then
          echo "Error: Downloaded file is not a valid gzip archive"
          file "${ARCHIVE_FILE}"
          exit 1
        fi

        cd /tmp
        tar -xzf "${ARCHIVE_FILE}"
        sudo rsync -av "${ARCHIVE_NAME}/etc/" /etc
        sudo rsync -av "${ARCHIVE_NAME}/usr/" /usr

        # podman searches /usr/bin/crun before the bundled /usr/local/bin/crun, so
        # install the bundled binary there too. Otherwise podman silently runs
        # whatever crun the runner image ships while `crun --version` reports the
        # bundled one -- the wrong runtime, reported wrongly. Using the bundled
        # binary also keeps crun at the version podman-static built against, well
        # above the 1.14.3 that podman's OCI specs require.
        sudo install -m 0755 "${ARCHIVE_NAME}/usr/local/bin/crun" /usr/bin/crun

        # Assigned rather than inlined into echo, so a failing pipeline under
        # `pipefail` aborts the step instead of printing a truncated version.
        crun_version=$(/usr/bin/crun --version | head -1)
        echo "crun in use (/usr/bin/crun): ${crun_version}"

        sudo podman version

    - shell: bash
      name: Start Podman Engine
      run: | # shell
        set -euo pipefail

        startup_timeout=60

        podman_version=$(sudo podman version --format="{{.Server.Version}}")
        if [[ -z "${podman_version}" ]]; then
          echo "::error::could not determine the podman server version"
          exit 1
        fi
        podman_socket="/var/run/podman-${podman_version}.sock"
        service_log="/tmp/podman-system-service.log"

        sudo podman system service --time=0 "unix://${podman_socket}" >"${service_log}" 2>&1 &
        service_pid=$!

        fail() {
          echo "::error::$1"
          echo "--- podman system service log ---"; cat "${service_log}" || true
          echo "--- podman processes ---"; pgrep -a podman || echo "(none)"
          exit 1
        }

        # `sudo` runs the engine under a monitor process, because Ubuntu sets
        # `Defaults use_pty`, so the backgrounded pid is sudo's rather than podman's
        # and outlives it. Identify the engine by the socket it was told to serve,
        # then confirm via comm that it is podman itself: the sudo front-end carries
        # the same arguments on its command line, and the runner image ships an
        # unrelated podman of its own.
        engine_running() {
          local pid
          for pid in $(pgrep -f "system service .*${podman_socket}" 2>/dev/null); do
            if [[ "$(cat "/proc/${pid}/comm" 2>/dev/null)" == podman ]]; then
              return 0
            fi
          done
          return 1
        }

        # Either process standing means the engine has not failed. The sudo pid
        # exists the instant the job is backgrounded, whereas podman itself only
        # appears once sudo has forked and exec'd it -- a window of a few
        # milliseconds. Testing for podman alone declares failure inside that
        # window, which is intermittent and looks exactly like a dead engine.
        engine_alive() {
          kill -0 "${service_pid}" 2>/dev/null || engine_running
        }

        # podman-static is built without systemd support, so there is no readiness
        # notification to block on. The deadline is the failure bound reported to a
        # human, not a synchronisation device.
        deadline=$(( SECONDS + startup_timeout ))
        until [[ -S "${podman_socket}" ]]; do
          engine_alive || [[ -S "${podman_socket}" ]] \
            || fail "podman system service exited before creating ${podman_socket}."
          (( SECONDS < deadline )) \
            || fail "podman system service did not create ${podman_socket} within ${startup_timeout}s."
          sleep 0.1
        done

        sudo chown "$(id -u):$(id -g)" "${podman_socket}"

        docker context create --docker "host=unix://${podman_socket}" "podman-${podman_version}" \
          || docker context update --docker "host=unix://${podman_socket}" "podman-${podman_version}"
        docker context use "podman-${podman_version}"

        # The socket exists from bind(2), which precedes listen(2), so the API can
        # refuse a connection briefly after the socket appears. `docker ps` rather
        # than `docker version`, because it exercises the engine instead of just the
        # HTTP mux. Each probe is bounded: the docker CLI applies no timeout of its
        # own, so an engine that accepts but never answers would otherwise hold the
        # job until it is killed, with none of the diagnostics below.
        deadline=$(( SECONDS + startup_timeout ))
        until timeout 5 docker ps >/dev/null 2>&1; do
          engine_alive || fail "podman system service died before serving the API."
          if (( SECONDS >= deadline )); then
            echo "--- final docker ps attempt ---"
            timeout 5 docker ps || true
            fail "podman API on ${podman_socket} did not become reachable within ${startup_timeout}s."
          fi
          sleep 0.5
        done

        # Startup output only; anything logged later stays in ${service_log}.
        echo "--- podman system service log ---"; cat "${service_log}" || true
        docker version --format 'Server: {{.Server.Version}}'
