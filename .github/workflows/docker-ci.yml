name: '🐳 Build'
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9][0-9][0-9]'
    paths:
      - 'dockerfiles/**/Dockerfile'
      - '.github/workflows/docker-ci.yml'
      - '.github/scripts/release-matrix.py'
  pull_request:
    paths:
      - 'dockerfiles/**/Dockerfile'
      - '.github/workflows/docker-ci.yml'
      - '.github/scripts/release-matrix.py'
  schedule:
    - cron: '0 0 * * 1'

jobs:
  glob-releases:
    name: Collect releases for checking
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.main.outputs.releases }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Download history, needed for .github/scripts/release-matrix.py
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Collect releases for checking
        id: main
        run: |
          set -euo pipefail
          echo -n "releases="                      >> "$GITHUB_OUTPUT"
          python .github/scripts/release-matrix.py >> "$GITHUB_OUTPUT"

  build:
    name: Test Build
    needs: glob-releases
    if: ${{ needs.glob-releases.outputs.releases != '[]' }}
    strategy:
      matrix:
        include: ${{ fromJSON(needs.glob-releases.outputs.releases) }}
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: registry.jetbrains.team
          username: ${{ secrets.SPACE_USERNAME }}
          password: ${{ secrets.SPACE_PASSWORD }}
      - uses: docker/login-action@v4
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_PASSWORD }}
      # internal.Dockerfile copies the IDE distribution from $TARGETPLATFORM in the context; stub only what it touches
      - name: Stub IDE distribution
        run: |
          dist="dockerfiles/${{ matrix.linter }}/${{ matrix.platform }}"
          mkdir -p "$dist/bin" "$dist/jbr/bin"
          touch "$dist/bin/qodana" "$dist/bin/stub.sh" "$dist/jbr/bin/java" "$dist/jbr/bin/javac" "$dist/qodana-clang" "$dist/qodana-cdnet"
          chmod +x "$dist/jbr/bin/java" "$dist/jbr/bin/javac"
      - name: Build
        uses: docker/build-push-action@v7
        with:
          tags: jetbrains/qodana-${{ matrix.linter }}:261
          context: dockerfiles/${{ matrix.linter }}
          file: dockerfiles/${{ matrix.linter }}/internal.Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

